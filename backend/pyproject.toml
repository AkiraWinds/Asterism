[project]
name = "asterism-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.0",
    "fastapi>=0.115",
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=1.0",
    "lxml-html-clean>=0.4.5",
    "openai>=2.48.0",
    "trafilatura>=2.1.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
